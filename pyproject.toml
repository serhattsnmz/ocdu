[project]
name = "ocdu"
version = "0.1.0"
description = "ncdu-like TUI to inspect and safely clean OpenCode data"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ocdu contributors" }]
keywords = ["opencode", "ncdu", "disk-usage", "tui", "textual", "cleanup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=8",
]

[project.scripts]
ocdu = "ocdu.__main__:main"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "git-filter-repo>=2.47.0",
    "pyinstaller>=6",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocdu"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "UP", "D1"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]
